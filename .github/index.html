<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }
    header {
        background: #4CAF50;
        color: white;
        width: 100%;
        text-align: center;
        padding: 1rem;
        margin-bottom: 2rem;
    }
    button {
        padding: 1rem 2rem;
        font-size: 1.2rem;
        cursor: pointer;
        background-color: #ff9800;
        color: white;
        border: none;
        border-radius: 8px;
        transition: background 0.2s;
    }
    button:hover {
        background-color: #e68a00;
    }
</style>
</head>
<body>

<header>
    <h1>My Dashboard</h1>
</header>

<main>
    <h2>Games</h2>
    <button onclick="goToCookieClicker()">Play Cookie Clicker</button>
</main>

<script>
function goToCookieClicker() {
    // Replace this URL with your own mini-game if needed
    window.location.href = "https://orteil.dashnet.org/cookieclicker/";
}
</script>

</body>
</html>
